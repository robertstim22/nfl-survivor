name = "nfl-survivor"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# NFL season year (the year the season starts)
SEASON = "2026"
# Your username; this account gets the Admin page
ADMIN_USERNAME = "tim"
# The GitHub Pages site allowed to call this API
ALLOWED_ORIGIN = "https://robertstim22.github.io"

# Optional secret INVITE_CODE: if set, people can only sign up through the invite link
# shown on the Admin page. If not set, anyone with the site's address can sign up.

[[d1_databases]]
binding = "DB"
database_name = "nfl-survivor"
# No database_id needed: `wrangler deploy` creates the database on the first deploy.

# Every 10 minutes: import games/spreads/scores and grade picks.
[triggers]
crons = ["*/10 * * * *"]
