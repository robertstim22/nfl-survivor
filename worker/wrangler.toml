name = "nfl-survivor"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# NFL season year (the year the season starts)
SEASON = "2026"
# Your username; this account gets the Admin page
ADMIN_USERNAME = "tim"
# The GitHub Pages site allowed to call this API
ALLOWED_ORIGIN = "https://robertstim22.github.io"

# Secret (not stored here): INVITE_CODE — the code in the invite link you send friends.
#   npx wrangler secret put INVITE_CODE

[[d1_databases]]
binding = "DB"
database_name = "nfl-survivor"
# Paste the id printed by `npx wrangler d1 create nfl-survivor`
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Every 10 minutes: import games/spreads/scores and grade picks.
[triggers]
crons = ["*/10 * * * *"]
